<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC02 - Gestão de Funcionários</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand"><i class="bi bi-briefcase-fill"></i> Startup de Tecnologia - Gestão de Funcionários</span>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="bi bi-person-plus"></i> Cadastro de Funcionários</h5>
                    </div>
                    <div class="card-body">
                        <form id="formFuncionario" method="post">
                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome:</label>
                                <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite o nome" required>
                            </div>
                            <div class="mb-3">
                                <label for="idade" class="form-label">Idade:</label>
                                <input type="number" class="form-control" id="idade" name="idade" min="0" placeholder="Digite a idade" required>
                            </div>
                            <div class="mb-3">
                                <label for="cargo" class="form-label">Cargo:</label>
                                <input type="text" class="form-control" id="cargo" name="cargo" placeholder="Digite o cargo" required>
                            </div>
                            <div class="mb-3">
                                <label for="salario" class="form-label">Salário:</label>
                                <div class="input-group">
                                    <span class="input-group-text">R$</span>
                                    <input type="number" class="form-control" id="salario" name="salario" min="0" step="0.01" placeholder="Digite o salário" required>
                                </div>
                            </div>
                            <div class="d-flex gap-2">
                                <input type="submit" class="btn btn-success" id="btnCadastrar" value="Cadastrar">
                                <input type="button" class="btn btn-outline-secondary" id="btnCancelar" value="Cancelar edição">
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="bi bi-table"></i> Funcionários Cadastrados</h5>
                    </div>
                    <div class="card-body table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>Idade</th>
                                    <th>Cargo</th>
                                    <th>Salário</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaFuncionarios">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm my-4">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="bi bi-bar-chart"></i> Relatórios</h5>
            </div>
            <div class="card-body">
                <div class="d-flex flex-wrap gap-2 mb-3">
                    <input type="button" class="btn btn-outline-primary" id="btnSalarioMaior5000" value="Salário maior que R$ 5000">
                    <input type="button" class="btn btn-outline-primary" id="btnMediaSalarial" value="Média salarial">
                    <input type="button" class="btn btn-outline-primary" id="btnCargosUnicos" value="Cargos únicos">
                    <input type="button" class="btn btn-outline-primary" id="btnNomesMaiusculo" value="Nomes em maiúsculo">
                </div>
                <div id="resultadoRelatorio" class="alert alert-info mb-0">Clique em um relatório para ver o resultado.</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
