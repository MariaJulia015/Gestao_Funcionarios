<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC02 - Gestão de Funcionários</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar bg-body-tertiary">
        <div class="container justify-content-center">
            <span class="navbar-brand mb-0 h1">Startup de Tecnologia - Gestão de Funcionários</span>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Cadastro de Funcionários</h2>
        <hr>
        <form id="formFuncionario" method="post">
            <div class="row">
                <div class="col-md-4">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="nome" name="nome" placeholder="Nome" required>
                        <label for="nome">Nome</label>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="form-floating mb-3">
                        <input type="number" class="form-control" id="idade" name="idade" min="0" placeholder="Idade" required>
                        <label for="idade">Idade</label>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="cargo" name="cargo" placeholder="Cargo" required>
                        <label for="cargo">Cargo</label>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-floating mb-3">
                        <input type="number" class="form-control" id="salario" name="salario" min="0" step="0.01" placeholder="Salário" required>
                        <label for="salario">Salário (R$)</label>
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <input type="button" class="btn btn-secondary" id="btnCancelar" value="Cancelar edição">
                <input type="submit" class="btn btn-primary" id="btnCadastrar" value="Cadastrar">
            </div>
        </form>

        <h2 class="mt-5">Funcionários Cadastrados</h2>
        <hr>
        <table class="table table-striped text-center">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Cargo</th>
                    <th>Salário</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaFuncionarios">
            </tbody>
        </table>

        <h2 class="mt-5">Relatórios</h2>
        <hr>
        <div class="row">
            <div class="col-md mb-2 d-grid"><input type="button" class="btn btn-outline-primary" id="btnSalarioMaior5000" value="Salário maior que R$ 5000"></div>
            <div class="col-md mb-2 d-grid"><input type="button" class="btn btn-outline-primary" id="btnMediaSalarial" value="Média salarial"></div>
            <div class="col-md mb-2 d-grid"><input type="button" class="btn btn-outline-primary" id="btnCargosUnicos" value="Cargos únicos"></div>
            <div class="col-md mb-2 d-grid"><input type="button" class="btn btn-outline-primary" id="btnNomesMaiusculo" value="Nomes em maiúsculo"></div>
        </div>
        <div id="resultadoRelatorio" class="mt-3 mb-5"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
